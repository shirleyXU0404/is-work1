name: Security CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python environment
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "safety<3" bandit

      - name: SAST Static Code Scan (bandit)
        continue-on-error: true
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          bandit -r . -x ./vulhub -f json -o bandit-report.json --exit-zero

      - name: SCA Dependency Scan (safety)
        continue-on-error: true
        run: |
          safety check -r requirements.txt --full-report > safety-report.txt || true

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.txt



